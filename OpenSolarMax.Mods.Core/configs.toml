# 胜利判定相关

[systems.victory]
require_all_planets = false
wave_max_interval = 0.1     # 胜利波纹动效：星球间最大触发间隔，秒
wave_total_seconds = 2.5    # 胜利波纹动效：从胜利帧起所有星球播完的总时长上限，秒

# 仿真系统相关

[systems.simulate.jumping]
charging_duration = 0.5
landing_duration = 0.5
fading_in_duration = 0.1
fading_out_duration = 0.25
arrival_time_offset = -8.5          # 抵达时间的绝对偏差（半边）
arrival_time_max_offset_ratio = 0.1 # 抵达时间的绝对偏差相对总时间的最大比例

# 输入系统相关

[systems.input.maneuvering]
minimal_select_pixels = 10

# 可视化系统相关

[systems.visualization.anchored_ships]
text.size = 36
text.template = "{0}"
shadow.distance = 2
shadow.density = 0.6
label.offset_multipliers = { x = 0.6, y = 0.72 }
ring.radius_multiplier = 2.4
ring.thickness = 3
ring.label.radius_multiplier = 3
ring.gap.deg = 3

[systems.visualization.barriers]
node.size = 16
node.color = "white"
edge.thickness = 8
edge.dash_length = 12
edge.gap_length = 3
edge.color = "pink"

[systems.visualization.colonization]
ring.radius_multiplier = 2.4
ring.thickness = 3
ring.default_alpha = 0.2

[systems.visualization.entity_ids]
text.size = 18
text.color = "red"

[systems.visualization.maneuvering_ships_status]
ring.radius_multiplier = 2.4
ring.offset = -8
ring.thickness = 4
ring.blocked.color = "red"
ring.selected.color = "white"
box.thickness = 4
box.color = "white * 0.5"
line.thickness = 4
line.round = 1
line.color = "white"
line.blocked.color = "red"

# 悬停发光的 radius_multiplier 与 offset 必须与上方 maneuvering_ships_status 的 ring.radius_multiplier、ring.offset 保持一致，保证发光外缘与细环重合
[systems.visualization.hover_glow]
minimal_hit_pixels = 10
radius_multiplier = 2.4
offset = -8
inner_factor = 1.0
alpha = 0.5

# 概念构造相关

[applier.celestial_body]
orbit.pitch.min.deg = -82.5
orbit.pitch.max.deg = -67.5
orbit.roll.min.deg = 0
orbit.roll.max.deg = 7.5

[applier.warp]
reference_radius = 25.6 # 128 / 2 * 0.4 : 以 1024px 等级纹理为基础, 乘上固定系数 0.4
volume = 40

[applier.tower]
reference_radius = 19.2 # 128 / 2 * 0.3 : 以 1024px 等级纹理为基础, 乘上固定系数 0.3
volume = 60             # 原版 S2 中为 30，但占领速度有 0.5 的 debuf

[applier.barrier]
node.size = { x = 27, y = 27 }
edge.space = 8
edge.color = "#ff4444"
edge.size = { x = 13.5, y = 27 }
edge.preview.width = 6

[applier.laser_beam]
width = 2 # 4 / 2

# 人口可视化标签
[applier.view.total_population_label]
color = "#ffaaaa"
opacity = 0.8
text.size = 36

# 舰船飞行比例滑动条
[applier.view.fleet_slider]
color = "#ffaaaa"
track.length = 960
track.thickness = 4
track.alpha.left = 0.5
track.alpha.right = 0.25
knot.width = 108
knot.height = 48
knot.alpha = 0.5
knot.thickness = 4
text.size = 36
text.alpha = 0.6
padding = 16
